<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>으뜸50안경 로그인</title><link rel="stylesheet" href="shell.css"></head><body class="login-art-body">
<form id="loginForm" class="art-stage login-art-stage" novalidate><img class="art" src="assets/ui/login-hq.jpg" alt="매장전용 통합 서비스 로그인"><button id="loginTab" class="hit login-tab" type="button"><span class="sr">로그인</span></button><button id="joinTab" class="hit join-tab" type="button"><span class="sr">가입하기</span></button><input id="storeQ" class="field store-field" type="text" placeholder="매장명을 검색해 주세요" autocomplete="off"><div id="suggest" class="suggest hidden"></div><input id="pw" class="field pw-field" type="password" inputmode="numeric" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password"><button id="pwToggle" class="hit pw-toggle" type="button" aria-label="비밀번호 표시"></button><button id="submit" class="hit submit-hit" type="submit"><span class="sr">로그인</span></button><button id="adminOpen" class="hit admin-hit" type="button"><span class="sr">관리자 모드</span></button></form>
<div id="modalRoot" class="dialog-backdrop hidden"><section class="dialog" role="dialog" aria-modal="true"><button id="modalClose" class="dialog-x" aria-label="닫기">×</button><h2 id="dialogTitle"></h2><p id="dialogDesc" class="dialog-desc"></p><div id="dialogBody"></div></section></div>
<script src="portal.js"></script><script>
let stores=[],picked=null,mode='login',mainMatches=[],mainActive=-1,joinMatches=[],joinActive=-1;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').toLowerCase().replace(/\s/g,'');
function showModal(t,d,h){$('#dialogTitle').textContent=t;$('#dialogDesc').textContent=d||'';$('#dialogBody').innerHTML=h;$('#modalRoot').classList.remove('hidden')}function closeModal(){$('#modalRoot').classList.add('hidden')}$('#modalClose').onclick=closeModal;$('#modalRoot').onclick=e=>{if(e.target===$('#modalRoot'))closeModal()};
async function loadStores(){$('#storeQ').placeholder='매장 정보를 불러오는 중입니다';try{const d=await rpc('list_store_directory');stores=Array.isArray(d)?d:(scalar(d)||[]);$('#storeQ').placeholder='매장명을 검색해 주세요'}catch(e){$('#storeQ').placeholder='매장 정보를 불러오지 못했습니다';console.error(e)}}
function chooseMain(i){const s=mainMatches[i];if(!s)return;picked=s;$('#storeQ').value=s.name||s.full_name;$('#suggest').classList.add('hidden');mainActive=-1;$('#pw').focus()}
function paintMainActive(){const btns=$('#suggest').querySelectorAll('button');btns.forEach((b,i)=>b.classList.toggle('active',i===mainActive));btns[mainActive]?.scrollIntoView({block:'nearest'})}
function searchStores(){const v=norm($('#storeQ').value);mainActive=-1;if(!v){mainMatches=[];$('#suggest').classList.add('hidden');return}mainMatches=stores.filter(s=>[s.name,s.full_name,s.code,s.region].some(x=>norm(x).includes(v))).slice(0,15);$('#suggest').innerHTML=mainMatches.length?mainMatches.map((s,i)=>`<button type="button" data-i="${i}"><b>${esc(s.name||s.full_name)}</b><span>${esc(s.region||s.code||'')}</span></button>`).join(''):'<div class="suggest-empty">검색된 매장이 없습니다.</div>';$('#suggest').classList.remove('hidden');$('#suggest').querySelectorAll('button').forEach(b=>b.onclick=()=>chooseMain(+b.dataset.i))}
function openJoin(){showModal('매장 가입하기','매장을 검색해 선택한 뒤 숫자 비밀번호를 등록해 주세요.',`<label class="dialog-label">매장명</label><input id="joinStoreQ" class="dialog-input" value="${esc(picked?.name||picked?.full_name||'')}" placeholder="매장명을 검색해 주세요" autocomplete="off"><div id="joinSuggest" class="dialog-suggest hidden"></div><label class="dialog-label">비밀번호</label><input id="joinPw" class="dialog-input" type="password" inputmode="numeric" placeholder="숫자 4자 이상 입력"><label class="dialog-label">비밀번호 확인</label><input id="joinPw2" class="dialog-input" type="password" inputmode="numeric" placeholder="숫자 비밀번호 다시 입력"><p id="joinErr" class="dialog-error hidden"></p><button id="joinSubmit" class="dialog-primary" type="button">가입하기</button>`);$('#joinSubmit').onclick=joinStore;$('#joinStoreQ').oninput=()=>{picked=null;searchJoinStores()};$('#joinStoreQ').onfocus=searchJoinStores;$('#joinStoreQ').onkeydown=e=>{if($('#joinSuggest').classList.contains('hidden'))return;if(e.key==='ArrowDown'){e.preventDefault();joinActive=Math.min(joinActive+1,joinMatches.length-1);paintJoinActive()}else if(e.key==='ArrowUp'){e.preventDefault();joinActive=Math.max(joinActive-1,0);paintJoinActive()}else if(e.key==='Enter'&&joinMatches.length){e.preventDefault();chooseJoin(joinActive<0?0:joinActive)}else if(e.key==='Escape')$('#joinSuggest').classList.add('hidden')}}
function chooseJoin(i){const s=joinMatches[i];if(!s)return;picked=s;$('#joinStoreQ').value=s.name||s.full_name;$('#joinSuggest').classList.add('hidden');joinActive=-1;$('#joinPw').focus()}
function paintJoinActive(){const btns=$('#joinSuggest').querySelectorAll('button');btns.forEach((b,i)=>b.classList.toggle('active',i===joinActive));btns[joinActive]?.scrollIntoView({block:'nearest'})}
function searchJoinStores(){const input=$('#joinStoreQ'),box=$('#joinSuggest'),v=norm(input.value);joinActive=-1;if(!v){joinMatches=[];box.classList.add('hidden');return}joinMatches=stores.filter(s=>[s.name,s.full_name,s.code,s.region].some(x=>norm(x).includes(v))).slice(0,12);box.innerHTML=joinMatches.length?joinMatches.map((s,i)=>`<button type="button" data-i="${i}"><b>${esc(s.name||s.full_name)}</b><span>${esc(s.region||s.code||'')}</span></button>`).join(''):'<div class="suggest-empty">검색된 매장이 없습니다.</div>';box.classList.remove('hidden');box.querySelectorAll('button').forEach(b=>b.onclick=()=>chooseJoin(+b.dataset.i))}
async function joinStore(){const err=$('#joinErr'),p=$('#joinPw').value.trim(),p2=$('#joinPw2').value.trim();err.classList.add('hidden');try{if(!picked)throw Error('로그인 화면에서 매장을 먼저 검색해 선택해 주세요.');if(!/^\d{4,}$/.test(p))throw Error('비밀번호는 숫자 4자 이상이어야 합니다.');if(p!==p2)throw Error('비밀번호 확인이 일치하지 않습니다.');await rpc('register_store',{p_code:picked.code,p_password:p});closeModal();$('#pw').focus();alert('가입이 완료되었습니다. 등록한 비밀번호로 로그인해 주세요.')}catch(e){err.textContent=e.message;err.classList.remove('hidden')}}
async function login(){const p=$('#pw').value.trim();if(!picked)return alert('검색 결과에서 매장을 선택해 주세요.');if(!p)return alert('비밀번호를 입력해 주세요.');if(!/^\d+$/.test(p))return alert('비밀번호는 숫자만 입력해 주세요.');try{const r=scalar(await rpc('login_store',{p_code:picked.code,p_password:p})),token=typeof r==='string'?r:r?.token;if(!token)throw Error('로그인 정보를 받지 못했습니다.');const me=scalar(await rpc('get_my_store',{p_token:token}));localStorage.setItem(SESSION,JSON.stringify({token,store:me}));localStorage.setItem('eutteum50:private:fc:session',JSON.stringify({token}));go('service.html')}catch(e){alert(e.message)}}
function openAdmin(){showModal('관리자 모드','관리자 비밀번호를 입력해 주세요.',`<form id="adminForm"><label class="dialog-label" for="adminPw">비밀번호</label><input id="adminPw" class="dialog-input" type="password" autocomplete="current-password"><p id="adminErr" class="dialog-error hidden"></p><button id="adminSubmit" class="dialog-primary" type="submit">확인</button></form>`);$('#adminForm').onsubmit=e=>{e.preventDefault();adminLogin()};requestAnimationFrame(()=>$('#adminPw').focus())}
async function adminLogin(){const err=$('#adminErr');err.classList.add('hidden');try{const token=scalar(await rpc('login_admin',{p_password:$('#adminPw').value.trim()}));if(!token)throw Error('관리자 로그인을 확인할 수 없습니다.');localStorage.setItem('eutteum50:portal-admin-session',JSON.stringify({token,at:Date.now()}));showModal('관리할 서비스 선택','관리 화면을 선택해 주세요.',`<div class="admin-services"><button onclick="go('ai-tools.html?admin=1')"><b>AI 콘텐츠 관리</b><span>제품·매장·프로모션·월간 문자 관리</span></button><button onclick="go('quiz-admin.html')"><b>교육용 퀴즈 관리</b><span>문제·정답·직원 프로필 관리</span></button></div>`)}catch(e){err.textContent=e.message;err.classList.remove('hidden')}}
$('#storeQ').oninput=()=>{picked=null;searchStores()};$('#storeQ').onfocus=searchStores;$('#storeQ').onkeydown=e=>{if($('#suggest').classList.contains('hidden'))return;if(e.key==='ArrowDown'){e.preventDefault();mainActive=Math.min(mainActive+1,mainMatches.length-1);paintMainActive()}else if(e.key==='ArrowUp'){e.preventDefault();mainActive=Math.max(mainActive-1,0);paintMainActive()}else if(e.key==='Enter'&&mainMatches.length){e.preventDefault();chooseMain(mainActive<0?0:mainActive)}else if(e.key==='Escape')$('#suggest').classList.add('hidden')};$('#loginTab').onclick=()=>$('#pw').focus();$('#joinTab').onclick=openJoin;$('#loginForm').onsubmit=e=>{e.preventDefault();login()};$('#pwToggle').onclick=()=>{$('#pw').type=$('#pw').type==='password'?'text':'password';$('#pw').focus()};$('#adminOpen').onclick=openAdmin;
// 로그인은 비밀번호 입력창에서 Enter로도 즉시 실행하고, 성공 후 추가 조회를 기다리지 않습니다.
login=async function(){const p=$('#pw').value.trim();if(!picked)return alert('검색 결과에서 매장을 선택해 주세요.');if(!p)return alert('비밀번호를 입력해 주세요.');if(!/^\d+$/.test(p))return alert('비밀번호는 숫자만 입력해 주세요.');const btn=$('#submit');if(btn.dataset.busy==='1')return;btn.dataset.busy='1';try{const raw=scalar(await rpc('login_store',{p_code:picked.code,p_password:p})),token=typeof raw==='string'?raw:raw?.token;if(!token)throw Error('로그인 정보를 받지 못했습니다.');const store={...picked,name:picked.name||picked.full_name,full_name:picked.full_name||picked.name};localStorage.setItem(SESSION,JSON.stringify({token,store}));localStorage.setItem('eutteum50:private:fc:session',JSON.stringify({token,store}));go('service.html')}catch(e){btn.dataset.busy='';alert(e.message)}};
adminLogin=async function(){const err=$('#adminErr');err.classList.add('hidden');try{const raw=scalar(await rpc('login_admin',{p_password:$('#adminPw').value.trim()})),token=typeof raw==='string'?raw:raw?.token;if(!token)throw Error('관리자 로그인을 확인할 수 없습니다.');localStorage.setItem('eutteum50:portal-admin-session',JSON.stringify({token,at:Date.now()}));go('ai-tools.html?admin=1')}catch(e){err.textContent=e.message;err.classList.remove('hidden')}};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});
if(new URLSearchParams(location.search).get('admin')==='1')openAdmin();if(session())go('service.html');else loadStores();
</script></body></html>
