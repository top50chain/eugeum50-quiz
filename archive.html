<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>보관함</title><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="ai-shell.css"><style>
body{margin:0;background:#f4f5f7;font-family:NexonLv1,sans-serif;color:#252b34}.archive-page{width:min(100%,520px);min-height:100dvh;margin:auto;padding:0 22px 105px;background:#fff;box-shadow:0 0 28px #17203314}.archive-head{position:relative;height:220px;padding-top:25px;overflow:hidden}.archive-logo{width:112px;cursor:pointer}.archive-head h1{margin:52px 0 6px;font-size:32px}.archive-head p{margin:0;color:#7d8591;font-size:13px}.archive-owl{position:absolute;right:-15px;bottom:-42px;width:195px;height:195px;object-fit:contain}.tools{position:relative;z-index:2}.search{display:flex;align-items:center;height:48px;padding:0 14px;border:1px solid #e0e4ea;border-radius:14px;background:#fafbfc}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 13px NexonLv1}.chips{display:flex;gap:7px;margin:12px 0 18px}.chips button{padding:8px 13px;border:1px solid #e0e4e9;border-radius:999px;background:#fff;color:#707986;font:700 11px NexonLv1}.chips button.on{border-color:#ff5a1f;background:#fff4ed;color:#ff5a1f}.archive-list{display:grid;gap:11px}.archive-card{position:relative;padding:16px;border:1px solid #e2e5e9;border-radius:17px;background:#fff;box-shadow:0 3px 12px #18233b08;transition:.16s}.archive-card:hover{border-color:#ffb18e;transform:translateY(-1px)}.archive-card .meta{color:#9299a4;font-size:10px}.archive-card h2{margin:7px 36px 5px 0;font-size:15px}.archive-card p{margin:0;color:#697281;font-size:11px;line-height:1.55}.archive-card .star{position:absolute;right:12px;top:11px;border:0;background:transparent;color:#b5bbc4;font-size:22px}.archive-card .star.on{color:#ff9d1f}.card-actions{display:flex;gap:6px;margin-top:12px}.card-actions button{padding:7px 10px;border:1px solid #e2e5e9;border-radius:9px;background:#fff;color:#616b79;font:700 10px NexonLv1}.card-actions .open{border-color:#ff8b5a;background:#fff4ed;color:#f05212}.empty{padding:46px 18px;text-align:center;border:1px dashed #dfe3e8;border-radius:18px;color:#858d99;font-size:13px}.loading{padding:30px;text-align:center;color:#8b929c}@media(min-width:900px){body{padding:18px}.archive-page{border-radius:20px}}
</style></head><body data-nav="archive"><main class="archive-page"><header class="archive-head"><img class="archive-logo" src="eutteum50-logo.png" alt="으뜸50안경" id="logo"><h1>보관함</h1><p>완성한 홍보 콘텐츠를 다시 확인해요.</p><img class="archive-owl" src="assets/characters/archive-owl.png" alt="파일을 든 부엉이 캐릭터"></header><section class="tools"><label class="search">⌕&nbsp;<input id="q" placeholder="제목이나 내용으로 검색"></label><div class="chips"><button class="on" data-filter="all">전체</button><button data-filter="favorite">즐겨찾기</button><button data-filter="recent">최신순</button></div></section><section id="list" class="archive-list"><div class="loading">보관함을 불러오는 중…</div></section></main><script src="portal.js"></script><script>
if(!session())go('index.html');const $=s=>document.querySelector(s),token=session().token,FAV='eutteum50:archive-favorites';let items=[],filter='all';const favs=()=>{try{return new Set(JSON.parse(localStorage.getItem(FAV)||'[]'))}catch{return new Set}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const idOf=(x,i)=>String(x.id||x.content_id||x.uuid||i);const titleOf=x=>x.title||x.subject||x.name||x.q||x.topic||'제목 없는 콘텐츠';const blockText=x=>(x.blocks||[]).flatMap(b=>b.variants?.length?b.variants:[b]).map(b=>[b.title,b.body,b.text].filter(Boolean).join('\n')).filter(Boolean).join('\n\n');const bodyOf=x=>typeof x.body==='string'?x.body:typeof x.content==='string'?x.content:x.text||x.result||x.summary||blockText(x)||'';const dateOf=x=>x.created_at||x.updated_at||x.createdAt||'';
function paint(){const f=favs(),needle=q.value.trim().toLowerCase();let rows=items.map((x,i)=>({...x,_id:idOf(x,i)})).filter(x=>!needle||`${titleOf(x)} ${bodyOf(x)}`.toLowerCase().includes(needle));if(filter==='favorite')rows=rows.filter(x=>f.has(x._id));rows.sort((a,b)=>String(dateOf(b)).localeCompare(String(dateOf(a))));list.innerHTML=rows.length?rows.map(x=>`<article class="archive-card"><button class="star ${f.has(x._id)?'on':''}" data-star="${esc(x._id)}" aria-label="즐겨찾기">★</button><div class="meta">${dateOf(x)?new Date(dateOf(x)).toLocaleDateString('ko-KR'):''}</div><h2>${esc(titleOf(x))}</h2><p>${esc(String(bodyOf(x)).slice(0,150))}</p><div class="card-actions"><button class="open" data-copy="${esc(x._id)}">내용 복사</button><button data-delete="${esc(x._id)}">삭제</button></div></article>`).join(''):'<div class="empty">저장된 콘텐츠가 없습니다.<br>글 생성에서 첫 콘텐츠를 만들어 보세요.</div>';document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const s=favs(),id=b.dataset.star;s.has(id)?s.delete(id):s.add(id);localStorage.setItem(FAV,JSON.stringify([...s]));paint()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const x=items.find((v,i)=>idOf(v,i)===b.dataset.copy);await navigator.clipboard.writeText([titleOf(x),bodyOf(x)].filter(Boolean).join('\n\n'));b.textContent='복사했어요';setTimeout(()=>b.textContent='내용 복사',1200)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('이 콘텐츠를 삭제할까요?'))return;try{await rpc('delete_store_content',{p_token:token,p_content_id:b.dataset.delete});items=items.filter((v,i)=>idOf(v,i)!==b.dataset.delete);paint()}catch(e){alert(e.message)}})}
async function load(){try{const d=scalar(await rpc('list_store_contents',{p_token:token}));const raw=Array.isArray(d)?d:Array.isArray(d?.items)?d.items:Array.isArray(d?.contents)?d.contents:[];items=raw.map(x=>({...x,...(x.content&&typeof x.content==='object'?x.content:{}),id:x.id||x.content?.id,created_at:x.created_at||x.content?.at}));paint()}catch(e){list.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}q.oninput=paint;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));paint()});logo.onclick=()=>go('service.html');load();
</script><script src="ai-shell.js"></script></body></html>
