<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교육용 퀴즈 관리자</title><script defer src="quiz-admin-fallback.js"></script><style>@font-face{font-family:NexonLv1;src:url('./fonts/NEXON-Lv1-Gothic-Regular.otf') format('opentype');font-weight:400;font-display:swap}@font-face{font-family:NexonLv1;src:url('./fonts/NEXON-Lv1-Gothic-Bold.otf') format('opentype');font-weight:700;font-display:swap}
:root{--o:#f15a0a;--bg:#f5f6f8;--line:#e3e7ed;--ink:#20242b;--muted:#727b88}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,system-ui,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:13px 22px;background:#fff;border-bottom:1px solid var(--line)}.top img{width:145px;height:46px;object-fit:contain}.top h1{font-size:18px;margin:0}.right{margin-left:auto}.wrap{max-width:1260px;margin:22px auto;padding:0 18px}.tabs,.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.on,.btn.primary{background:var(--o);color:#fff;border-color:var(--o)}.btn.danger{color:#c43c35}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.toolbar{margin-bottom:16px}.toolbar input,.toolbar select{min-width:150px;flex:1;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.grid{display:grid;gap:9px}.row{display:grid;grid-template-columns:120px 1fr 90px 90px auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}.qcard{border:1px solid var(--line);border-radius:15px;padding:15px}.qcard h3{font-size:16px;margin:5px 0 9px}.qcard p{margin:5px 0;line-height:1.55}.meta,.muted{color:var(--muted);font-size:12px}.answer{color:#087a52;font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px}.modal{position:fixed;inset:0;background:rgba(20,25,34,.5);display:grid;place-items:center;padding:18px;z-index:20}.editor{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.editor h2{margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.field textarea{min-height:92px;resize:vertical}.span2{grid-column:1/-1}.choice{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:7px}.footer{display:flex;justify-content:center;margin:20px 0}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#fff2e9;color:var(--o);font-size:11px;font-weight:800}@media(max-width:720px){.top{padding:10px}.top img{width:100px}.top h1{font-size:14px}.wrap{padding:0 10px;margin:12px auto}.panel{padding:13px}.row{grid-template-columns:1fr 1fr}.row .name,.row .actions{grid-column:1/-1}.fields{grid-template-columns:1fr}.span2{grid-column:auto}.right .btn{font-size:12px;padding:8px}}
</style></head><body><header class="top"><img src="eutteum50-logo.png" alt="으뜸50안경"><h1>교육용 퀴즈 관리자</h1><div class="right"><button class="btn" onclick="location.href='ai-tools.html?admin=1'">AI 콘텐츠 관리</button></div></header><div class="wrap"><div class="tabs"><button class="btn on" data-tab="profiles">직원 프로필</button><button class="btn" data-tab="questions">문제·정답·해설</button></div><section class="panel" id="profiles"><div class="toolbar"><input id="profileSearch" placeholder="매장코드 또는 직원명 검색"><button class="btn primary" id="refreshProfiles">새로고침</button></div><div id="profileRows" class="grid"></div></section><section class="panel hidden" id="questions"><div class="toolbar"><select id="cat"><option value="">전체 대분류</option><option value="glasses">안경렌즈</option><option value="contact">콘택트렌즈</option><option value="gilbert">길버트 검안법</option></select><select id="topic"><option value="">전체 세부 카테고리</option></select><input id="qSearch" placeholder="문제·해설 검색"><button class="btn primary" id="addQuestion">+ 문제 등록</button></div><div id="questionRows" class="grid"></div></section><div class="footer"><button class="btn" id="adminExit">관리자모드 나가기</button></div></div>
<div id="editorModal" class="modal hidden"><section class="editor"><h2 id="editorTitle">문제 등록</h2><div class="fields"><div class="field"><label>대분류</label><select id="eCat"><option value="glasses">안경렌즈</option><option value="contact">콘택트렌즈</option><option value="gilbert">길버트 검안법</option></select></div><div class="field"><label>세부 카테고리</label><input id="eTopic" list="topicList" placeholder="예: 누진·이중초점"><datalist id="topicList"></datalist></div><div class="field span2"><label>문제</label><textarea id="eQ"></textarea></div><div class="field span2"><label>보기와 정답</label><div id="choices"></div></div><div class="field span2"><label>핵심 한 줄</label><input id="eKey"></div><div class="field span2"><label>해설</label><textarea id="eExp"></textarea></div><div class="field"><label><input id="eImp" type="checkbox"> 중요 문제로 표시</label></div><div class="field"><label><input id="eActive" type="checkbox" checked> 학습 화면에 표시</label></div></div><div class="actions" style="margin-top:16px"><button class="btn danger hidden" id="deleteQuestion">삭제</button><button class="btn primary" id="saveQuestion">저장</button></div></section></div>
<style>html body,button,input,select,textarea{font-family:NexonLv1,system-ui,sans-serif}</style><script src="quiz-bank.js"></script><script>
const U='https://rzhjgjujmvxhvkbuofck.supabase.co',K='sb_publishable_j3VXPJJw6znG_hquWCRIfg_1nnCDp9F';let token='',profiles=[],questions=[],editing=null;try{token=JSON.parse(localStorage.getItem('eutteum50:portal-admin-session')||'null')?.token||''}catch{}if(!token)location.href='index.html?admin=1';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(n,b={}){const r=await fetch(`${U}/rest/v1/rpc/${n}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||'요청에 실패했습니다.');return d}
async function loadProfiles(){try{profiles=await rpc('quiz_admin_list_profiles',{p_token:token});paintProfiles()}catch(e){$('#profileRows').innerHTML=`<div class="empty">${esc(e.message)}<br>퀴즈 DB 업그레이드 SQL을 먼저 실행해 주세요.</div>`}}function paintProfiles(){const q=$('#profileSearch').value.trim().toLowerCase(),list=profiles.filter(p=>!q||`${p.store_code} ${p.display_name}`.toLowerCase().includes(q));$('#profileRows').innerHTML=list.map(p=>`<div class="row"><span>${esc(p.store_code)}</span><b class="name">${esc(p.display_name)}</b><span>${p.xp} XP</span><span>${p.has_pin?'PIN 사용':'PIN 없음'}</span><span class="actions"><button class="btn" data-pin="${p.id}">PIN 재설정</button> <button class="btn" data-active="${p.id}" data-next="${!p.active}">${p.active?'숨김':'복구'}</button></span></div>`).join('')||'<div class="empty">표시할 프로필이 없습니다.</div>';document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>resetPin(b.dataset.pin));document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>setActive(b.dataset.active,b.dataset.next==='true'))}async function resetPin(id){const pin=prompt('새 PIN 숫자 4자리를 입력하세요.\nPIN을 없애려면 빈칸으로 확인하세요.');if(pin===null)return;if(pin&&!/^\d{4}$/.test(pin))return alert('숫자 4자리만 입력해 주세요.');await rpc('quiz_admin_reset_pin',{p_token:token,p_profile_id:id,p_new_pin:pin});alert('PIN을 재설정했습니다.');loadProfiles()}async function setActive(id,v){await rpc('quiz_admin_set_profile_active',{p_token:token,p_profile_id:id,p_active:v});loadProfiles()}
async function loadQuestions(){const box=$('#questionRows');box.innerHTML='<div class="empty">문제를 불러오는 중…</div>';try{await rpc('quiz_admin_seed_questions',{p_token:token,p_items:window.QUIZ_ADMIN_BANK||[]});questions=await rpc('quiz_admin_list_questions',{p_token:token});fillTopics();paintQuestions()}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}<br>퀴즈 DB 업그레이드 SQL을 먼저 실행해 주세요.</div>`}}function fillTopics(){const old=$('#topic').value,topics=[...new Set(questions.filter(x=>!$('#cat').value||x.cat===$('#cat').value).map(x=>x.topic))].sort();$('#topic').innerHTML='<option value="">전체 세부 카테고리</option>'+topics.map(t=>`<option>${esc(t)}</option>`).join('');if(topics.includes(old))$('#topic').value=old;$('#topicList').innerHTML=[...new Set(questions.map(x=>x.topic))].sort().map(t=>`<option value="${esc(t)}">`).join('')}function paintQuestions(){const c=$('#cat').value,t=$('#topic').value,q=$('#qSearch').value.trim().toLowerCase(),names={glasses:'안경렌즈',contact:'콘택트렌즈',gilbert:'길버트 검안법'},list=questions.filter(x=>(!c||x.cat===c)&&(!t||x.topic===t)&&(!q||`${x.q} ${x.exp} ${x.key}`.toLowerCase().includes(q)));$('#questionRows').innerHTML=list.map((x,i)=>`<article class="qcard"><div class="meta">${names[x.cat]||esc(x.cat)} · ${esc(x.topic)} ${x.imp?'<span class="badge">중요</span>':''} ${x.active?'':'<span class="badge">숨김</span>'}</div><h3>${i+1}. ${esc(x.q)}</h3><p class="answer">정답: ${esc(x.choices?.[x.a]||'')}</p><p><b>해설</b> ${esc(x.exp||x.key||'')}</p><button class="btn" data-edit="${x.source_key}">수정·이동</button></article>`).join('')||'<div class="empty">조건에 맞는 문제가 없습니다.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(questions.find(x=>x.source_key===b.dataset.edit)))}
function choiceRows(x={}){$('#choices').innerHTML=[0,1,2,3].map(i=>`<div class="choice"><input type="radio" name="ans" value="${i}" ${Number(x.a||0)===i?'checked':''}><input class="cval" value="${esc(x.choices?.[i]||'')}" placeholder="보기 ${i+1}"></div>`).join('')}function openEditor(x=null){editing=x;$('#editorTitle').textContent=x?'문제 수정·카테고리 이동':'새 문제 등록';$('#eCat').value=x?.cat||'glasses';$('#eTopic').value=x?.topic||'';$('#eQ').value=x?.q||'';$('#eKey').value=x?.key||'';$('#eExp').value=x?.exp||'';$('#eImp').checked=!!x?.imp;$('#eActive').checked=x?.active!==false;choiceRows(x||{});$('#deleteQuestion').classList.toggle('hidden',!x);$('#editorModal').classList.remove('hidden')}async function saveQuestion(){const choices=[...document.querySelectorAll('.cval')].map(x=>x.value.trim()),a=Number(document.querySelector('input[name=ans]:checked')?.value||0),item={source_key:editing?.source_key||null,cat:$('#eCat').value,topic:$('#eTopic').value.trim(),q:$('#eQ').value.trim(),choices,a,key:$('#eKey').value.trim(),exp:$('#eExp').value.trim(),imp:$('#eImp').checked,active:$('#eActive').checked};if(!item.topic||!item.q||choices.some(x=>!x))return alert('카테고리, 문제와 보기 4개를 모두 입력해 주세요.');await rpc('quiz_admin_save_question',{p_token:token,p_item:item});$('#editorModal').classList.add('hidden');await loadQuestions()}async function delQuestion(){if(!editing||!confirm('이 문제를 삭제할까요?'))return;await rpc('quiz_admin_delete_question',{p_token:token,p_source_key:editing.source_key});$('#editorModal').classList.add('hidden');await loadQuestions()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('#profiles').classList.toggle('hidden',b.dataset.tab!=='profiles');$('#questions').classList.toggle('hidden',b.dataset.tab!=='questions');if(b.dataset.tab==='questions')loadQuestions()});$('#profileSearch').oninput=paintProfiles;$('#refreshProfiles').onclick=loadProfiles;$('#cat').onchange=()=>{fillTopics();paintQuestions()};$('#topic').onchange=$('#qSearch').oninput=paintQuestions;$('#addQuestion').onclick=()=>openEditor();$('#editorModal').onclick=e=>{if(e.target!==$('#editorModal'))return;if(confirm('작성하거나 수정한 내용은 저장되지 않습니다. 창을 닫을까요?'))$('#editorModal').classList.add('hidden')};$('#saveQuestion').onclick=()=>saveQuestion().catch(e=>alert(e.message));$('#deleteQuestion').onclick=()=>delQuestion().catch(e=>alert(e.message));$('#adminExit').onclick=()=>location.href='index.html?admin=1';loadProfiles();
</script></body></html>
